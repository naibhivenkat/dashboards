<!DOCTYPE html>
<html>
<head>
  <title>Payment - Grocery App</title>
  <meta charset="UTF-8">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="font-family: Arial; max-width: 500px; margin: auto; padding: 20px;">

  <h2>Demo Payment</h2>
  <p>This is a demo Razorpay checkout for review purposes.</p>

  <button id="payBtn" style="padding:12px 24px;">Pay ₹10</button>

  <script>
    document.getElementById("payBtn").onclick = function () {
      var options = {
        key: "rzp_test_xxxxxxxx",   // ⚠️ YOUR TEST KEY ONLY
        amount: 1000,
        currency: "INR",
        name: "Grocery App",
        description: "Demo Order",
        handler: function (response) {
          alert("Payment Successful (Demo)");
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    };
  </script>

  <p style="margin-top:20px;">
    <a href="index.html">← Back to Home</a>
  </p>

</body>
</html>
